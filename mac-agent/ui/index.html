<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boo Board</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e3e3e8; --accent:#d97757; --ok:#2da44e; --bad:#d1242f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161618; --card:#1f1f22; --ink:#f2f2f4; --mute:#9a9aa1; --line:#2d2d32; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  .wrap { display:grid; grid-template-columns:200px 1fr; min-height:100vh; }
  nav { padding:20px 12px; border-right:1px solid var(--line); position:sticky; top:0; height:100vh; }
  nav h1 { font-size:15px; margin:0 8px 16px; display:flex; gap:8px; align-items:center; }
  nav button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink); padding:8px 10px; border-radius:8px; font:inherit; cursor:pointer; }
  nav button:hover { background:var(--line); }
  nav button.on { background:var(--tab, var(--accent)); color:#fff; }
  nav .sep { height:1px; background:var(--line); margin:10px 8px; }
  main { padding:24px 32px 96px; max-width:800px; }
  h2 { margin:0 0 4px; font-size:22px; }
  h3 { margin:22px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); }
  .sub { color:var(--mute); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 16px; margin-bottom:16px; }
  .row { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .t { flex:1; min-width:0; } .row .d { color:var(--mute); font-size:12px; } .row .e { color:var(--bad); font-size:12px; }
  input[type=text], input[type=password], input[type=number], select, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:0; }
  input[type=number] { width:100px; } input.wide { width:260px; }
  input[type=color] { width:38px; height:30px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--bg); cursor:pointer; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  input.bad { border-color:var(--bad); }
  .sw { position:relative; width:42px; height:24px; flex:none; }
  .sw input { opacity:0; position:absolute; inset:0; margin:0; cursor:pointer; z-index:1; }
  .sw i { position:absolute; inset:0; background:var(--line); border-radius:12px; transition:.15s; }
  .sw i::after { content:""; position:absolute; left:2px; top:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px #0004; }
  .sw input:checked + i { background:var(--accent); } .sw input:checked + i::after { left:20px; }
  .btn { white-space:nowrap; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 16px; font:inherit; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .btn.ghost { background:none; color:var(--ink); border:1px solid var(--line); }
  .btn.small { padding:5px 8px; } .btn.danger:hover { color:var(--bad); border-color:var(--bad); }
  .btn:disabled { opacity:.4; cursor:default; }
  svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .bar { position:fixed; left:200px; right:0; bottom:0; padding:12px 32px; background:var(--card); border-top:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  .bar .msg { color:var(--mute); flex:1; } .bar .msg.err { color:var(--bad); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--mute); margin-right:6px; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; padding:12px 0; }
  .opts label { border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; cursor:pointer; }
  .opts label.on { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:-2px; }
  .opts input { display:none; } .opts svg.pic { display:block; margin:0 auto 6px; height:36px; width:auto; }
  .servers .srv { display:grid; grid-template-columns:auto 1fr auto; gap:8px 12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .servers .srv:last-child { border-bottom:0; }
  .servers .fields { display:flex; gap:8px; flex-wrap:wrap; } .servers .fields input[type=text] { flex:1; min-width:120px; }
  .servers .more { grid-column:2 / 4; display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--mute); font-size:12px; }
  .servers .more label { display:flex; gap:6px; align-items:center; }
  .tile { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; }
  .glyphs { display:flex; flex-wrap:wrap; gap:6px; }
  .glyphs button { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:4px; cursor:pointer; line-height:0; color:var(--ink); }
  .glyphs button.on { outline:2px solid var(--accent); }
  .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 14px); grid-auto-columns:14px; justify-content:start; gap:3px; padding:14px 0; overflow-x:auto; }
  .heat i { width:14px; height:14px; border-radius:3px; background:var(--line); }
  .legend { display:flex; gap:4px; align-items:center; color:var(--mute); font-size:12px; padding-bottom:12px; } .legend i { width:12px; height:12px; border-radius:3px; display:inline-block; }
  /* The mascots stand on one line: whatever their height, the names sit at the same level (the bottom edge). */
  .masc { display:flex; align-items:flex-end; flex-wrap:wrap; gap:12px; padding:14px 0; }
  .masc .mc { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:8px; min-width:84px; padding:10px 8px; border:2px solid transparent; border-radius:12px; text-align:center; color:var(--mute); font-size:12px; cursor:pointer; user-select:none; }
  .masc .mc:hover { background:var(--bg); } .masc .mc.on { border-color:var(--acc); color:var(--ink); }
  .masc .mc svg { display:block; transform-origin:50% 100%; } .masc .mc .eh { display:none; }
  .masc .mc.happy .eh { display:inline; } .masc .mc.happy .eo { display:none; }
  .masc .mc.happy svg { animation:hop .5s ease-in-out 4; }
  @keyframes hop { 0%,100% { transform:translateY(0) scale(1.08,.9); } 15% { transform:translateY(0) scale(1,1); } 50% { transform:translateY(-14px) scale(.96,1.06); } 85% { transform:translateY(0) scale(1,1); } }
  @media (prefers-reduced-motion: reduce) { .masc .mc.happy svg { animation:none; } }
  .about a { color:var(--accent); }
  .note { padding:12px 0; color:var(--mute); }
  .warn { background:#d1242f18; border:1px solid var(--bad); color:var(--ink); border-radius:10px; padding:10px 14px; margin-bottom:16px; }
  code { background:var(--bg); padding:1px 5px; border-radius:5px; }
  /* Phones and narrow windows: the tabs become a strip on top, rows stack, the save bar spans the width. */
  @media (max-width: 760px) {
    .wrap { display:block; }
    nav { position:sticky; top:0; z-index:5; height:auto; display:flex; gap:6px; align-items:center; overflow-x:auto; padding:8px 12px; border-right:0; border-bottom:1px solid var(--line); background:var(--bg); -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    nav h1 { font-size:0; margin:0 4px 0 0; flex:none; }
    nav button { width:auto; flex:none; white-space:nowrap; padding:9px 14px; }
    nav .sep { width:1px; height:22px; margin:0 2px; flex:none; }
    main { padding:16px 14px calc(120px + env(safe-area-inset-bottom)); max-width:none; }
    h2 { font-size:20px; }
    .card { padding:2px 12px; }
    .row { flex-wrap:wrap; gap:8px 12px; }
    .row .t { flex:1 1 200px; }
    input[type=text], input[type=password], input[type=number], select, textarea { font-size:16px; padding:9px 10px; }
    input.wide { width:100%; flex:1 1 100%; }
    input[type=number] { width:110px; }
    select { max-width:100%; }
    input[type=color] { width:46px; height:38px; }
    .btn { padding:10px 16px; } .btn.small { padding:8px 10px; }
    .bar { left:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); flex-wrap:wrap; gap:8px; }
    .bar .msg { flex:1 1 100%; font-size:12px; }
    .bar .btn { flex:1; justify-content:center; }
    .servers .srv { grid-template-columns:auto 1fr; }
    .servers .srv > :nth-child(3) { grid-column:1 / -1; justify-self:end; }
    .servers .more { grid-column:1 / -1; }
    .opts { grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
  }
</style>
</head>

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'X-Token': T, 'Content-Type': 'application/json', ...(opts.headers || {}) } });

// ---- the ghost: menu-bar icon previews and the mascots --------------------------------------------
const GHOST = ['...xxxxx...', '..xxxxxxx..', '.xxxxxxxxx.', '.xx.xxx.xx.', '.xx.xxx.xx.', '.xxxxxxxxx.', '.xxxxxxxxx.', '.xxxxxxxxx.', '.xxxxxxxxx.', '.xxxx.xxxx.', '.xxx...xxx.'];
const BANDS = ['#d97757', '#d97757', '#d97757', '#ffd000', '#ffd000', '#ffd000', '#3ddc84', '#3ddc84', '#4da3ff', '#4da3ff', '#4da3ff'];
const TRAY = { mono: null, orange: '#d97757', rainbow: 'bands', green: '#3ddc84', blue: '#4da3ff' };
const TRAY_NAME = { mono: 'trayMono', orange: 'trayOrange', rainbow: 'trayRainbow', green: 'trayGreen', blue: 'trayBlue' };
function ghostSvg(style, cls = 'pic') {
  let r = '';
  GHOST.forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== 'x') return;
    const fill = style === 'mono' ? 'currentColor' : TRAY[style] === 'bands' ? BANDS[y] : TRAY[style];
    r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fill}"/>`;
  }));
  return `<svg class="${cls}" viewBox="0 0 11 11" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
}
// The mascots as the bar draws them: the body in rows, the eyes apart (open and happy) so a click can make them happy.
// "#" = the body (Claude takes the accent colour), o y g b = the ghost's rainbow bands, n = the cat's nose.
const MASCOTS = {
  ghost: { rows: ['...ooooo...', '..ooooooo..', '.ooooooooo.', '.yyyyyyyyy.', '.yyyyyyyyy.', '.yyyyyyyyy.', '.ggggggggg.', '.ggggggggg.', '.bbbbbbbbb.', '.bbbb.bbbb.', '.bbb...bbb.'], colors: { o: '#d97757', y: '#ffd000', g: '#3ddc84', b: '#4da3ff' }, open: [[3, 3], [3, 4], [7, 3], [7, 4]], happy: [[3, 3], [2, 4], [4, 4], [7, 3], [6, 4], [8, 4]] },
  claude: { rows: ['.##########.', '.##########.', '.##########.', '############', '############', '.##########.', '.##########.', '..#.#..#.#..', '..#.#..#.#..'], colors: { '#': 'var(--acc)' }, open: [[3, 1], [3, 2], [8, 1], [8, 2]], happy: [[3, 1], [2, 2], [4, 2], [8, 1], [7, 2], [9, 2]] },
  block: { rows: ['..########..', '.##########.', '############', '############', '############', '############', '.##########.', '..########..'], colors: { '#': '#3d8bff' }, open: [[3, 3], [3, 4], [8, 3], [8, 4]], happy: [[3, 3], [2, 4], [4, 4], [8, 3], [7, 4], [9, 4]] },
  cat: { rows: ['.#........#.', '.##......##.', '.##########.', '.##########.', '.##########.', '.##########.', '####nn######', '############', '..########..', '...##..##...', '...##..##...'], colors: { '#': '#ededed', n: '#ff7f9f' }, open: [[3, 4], [3, 5], [8, 4], [8, 5]], happy: [[3, 4], [2, 5], [4, 5], [8, 4], [7, 5], [9, 5]] },
};
function mascotSvg(id) {
  const m = MASCOTS[id];
  const rect = (x, y, fill) => `<rect x="${x}" y="${y}" width="1" height="1" style="fill:${fill}"/>`;
  let body = '';
  m.rows.forEach((row, y) => [...row].forEach((c, x) => { if (c !== '.') body += rect(x, y, m.colors[c] || m.colors['#']); }));
  const eyes = list => list.map(([x, y]) => rect(x, y, '#000')).join('');
  const cols = m.rows[0].length;
  return `<svg viewBox="0 0 ${cols} ${m.rows.length}" width="${5 * cols}" height="${5 * m.rows.length}" xmlns="http://www.w3.org/2000/svg">${body}<g class="eo">${eyes(m.open)}</g><g class="eh">${eyes(m.happy)}</g></svg>`;
}
// Ghost first, then the others; the names come from the texts.

let happyTimer = 0;
/** The mascot is chosen as if from the list: the select follows, the frame is drawn in the accent colour, it jumps for joy for 2 seconds. */
function pickMascot(id) {

}
function showMascot(id, happy) {
  document.querySelectorAll('.masc .mc').forEach(el => {

/** A 9x9 LED glyph from glyphs.json as an inline SVG in the given colour. */

// ---- generic fields (settings of the screens) ------------------------------------------------
function fieldRow(gid, key, f) {
  const v = sets[gid][key];
  const id = `${gid}.${key}`;
  let input;
  if (f.type === 'boolean') input = `<label class="sw"><input type="checkbox" data-f="${id}" ${v ? 'checked' : ''}><i></i></label>`;
  else if (f.type === 'integer') input = `<input type="number" data-f="${id}" value="${esc(v)}" min="${f.min}" max="${f.max}" step="${f.step ?? 1}">`;
  else if (f.type === 'color') input = `<input type="color" data-f="${id}" value="${esc(v)}"><button class="btn ghost small" data-reset="${id}" title="${esc(t('byDefault'))}">${icon('undo-2')}</button>`;
  else if (f.type === 'enum') input = `<select data-f="${id}">${f.options.map(o => `<option value="${esc(o.value)}" ${o.value === v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  else input = `<input class="wide" type="text" data-f="${id}" value="${esc(v)}">`;
  return `<div class="row"><div class="t">${esc(f.label)}${f.description ? `<div class="d">${esc(f.description)}</div>` : ''}</div><div style="display:flex;gap:6px;align-items:center">${input}</div></div>`;
}
function screenToggle(gid) {
  const key = SCREENS[gid];

  if (!key || !(D.bar.doc && key in (D.bar.doc.values || {}))) return '';
  return `<div class="row"><div class="t">${t('showScreen')}<div class="d">${D.bar.online ? t('showScreenOn') : t('showScreenOff')}</div></div><label class="sw"><input type="checkbox" data-b="${key}" ${bar[key] ? 'checked' : ''} ${D.bar.online ? '' : 'disabled'}><i></i></label></div>`;
}

function bindFields() {

// ---- work: activity like GitHub's -----------------------------------------------------------
function heatmap() {
  const h = S?.work?.history || {};
  const color = sets.work.color;
  const fmt = s => Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const days = Math.max(7, sets.work.keepDays);
  const today = new Date();
  const first = new Date(today); first.setDate(today.getDate() - days + 1);
  const lead = (first.getDay() + 6) % 7; // Monday first
  const max = Math.max(1, ...Object.values(h));
  const level = s => (s <= 0 ? 0 : Math.min(4, 1 + Math.floor(s / max * 3.999)));
  const alpha = [0, .3, .5, .75, 1];
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<i style="visibility:hidden"></i>';
  for (let i = 0; i < days; i++) {
    const d = new Date(first); d.setDate(first.getDate() + i);
    const sec = h[key(d)] || 0, l = level(sec);
    cells += `<i title="${key(d)}: ${sec ? fmt(sec) : t('noData')}" style="${l ? `background:${color};opacity:${alpha[l]}` : ''}"></i>`;
  }
  const legend = [0, 1, 2, 3, 4].map(l => `<i style="${l ? `background:${color};opacity:${alpha[l]}` : 'background:var(--line)'}"></i>`).join('');
  return `<h3>${t('activity')}</h3><div class="card"><div class="heat">${cells}</div><div class="legend">${t('less')} ${legend} ${t('more')} · ${t('heatNote', { n: days })}</div></div>`;
}

  }
  if (id === 'work') return heatmap();
  if (id === 'app') return aboutCard();
  if (id === 'ai') {
    const c = S?.claude;
    const text = c ? (c.active ? t('aiActive', { t: c.blockTokens, c: c.blockCost }) : t('aiIdle')) : t('noData');
    const agentRows = (S?.agents || []).map(a => `<div class="row"><div class="t">${dot(a.busy)}${esc(a.name)}${a.up ? `<div class="d">${t('aiUp', { n: a.up })}</div>` : ''}</div><span class="d">${a.busy ? t('aiWorking') : t('aiIdle2')}</span></div>`).join('');
    return `<h3>${t('aiAgents')}</h3><div class="card">${agentRows || `<div class="note">${t('aiAgentNone')}</div>`}</div>
    <h3>${t('aiMascots')}</h3><div class="card">${mascotPanel()}</div>
    <h3>${t('aiNow')}</h3><div class="card"><div class="row"><div class="t">${esc(text)}<div class="d">${t('aiPrices')}</div></div></div></div>
    <h3>${t('aiOthers')}</h3><div class="card"><div class="row"><div class="t">${t('aiOthersT')}<div class="d">${t('aiOthersD', { c: '<code>node mac-agent/bin/notify.mjs ai_done "Codex: project"</code>', w: '<code>ai_wait</code>' })}</div></div></div></div>`;
  }
  return '';
}
function aboutCard() {
  const a = D.about;
  const link = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;
  return `<h3>${t('aboutTitle')}</h3><div class="card about"><div class="row" style="display:block"><div class="t"><b>${esc(a.name)}</b><div class="d" style="font-size:13px">${t('aboutText')}</div></div></div>
    <div class="row"><div class="t">${t('aboutVersion')}</div><span>${esc(a.version)}</span></div>
    <div class="row"><div class="t">${t('aboutRepo')}</div>${link(a.repo, a.repo.replace('https://', ''))}</div>
    <div class="row"><div class="t">${t('aboutAuthor')}</div>${link(a.authorUrl, a.author)}</div></div>`;
}
function bindExtras() {
  const ex = $('#exclude'); if (ex) ex.oninput = () => { agent.calendarExclude = ex.value.split('\n').map(s => s.trim()).filter(Boolean); touch(); };
  if (tab === 'servers') bindServers();
}

// ---- general tab -----------------------------------------------------------------------------
function loginNote() {
  const st = S?.tray?.loginItem;
  if (!S?.tray?.running) return t('loginNoTray');
  if (st === 'enabled') return t('loginOn');
  if (st === 'requiresApproval') return t('loginAsk');
  return t('loginOff');
}
const APP_ICON = { tray: 'iconTray', dock: 'iconDock', both: 'iconBoth', none: 'iconNone' };
const reserved = n => (D.reserved || []).includes(String(n).toLowerCase());
function general() {
  const online = D.bar.online;
  const link = D.link;
  const linked = bar.agent_host === link.host && bar.agent_port === link.port;
  const langField = D.schema.fields.lang;
  const url = D.aliasUrl || `http://127.0.0.1:${link.port}/ui`;
  const name = agent.uiHostname;
  return `<h2>${t('general')}</h2><p class="sub">${t('generalSub')}</p>
  ${online ? '' : `<div class="warn">${t('barWarn', { e: D.bar.error ? ': ' + esc(D.bar.error) : '' })}</div>`}
  <h3>${t('bar')}</h3><div class="card">
    <div class="row"><div class="t">${dot(online)}${t('barAddr')}<div class="d">${t('barAddrD')}</div></div><input class="wide" type="text" id="barHost" value="${esc(agent.bar.host)}" placeholder="192.168.1.68"></div>
    <div class="row"><div class="t">${t('barPass')}<div class="d">${D.config.bar.hasPassword ? t('passSaved') : t('passNone')}</div></div><input class="wide" type="password" id="barPass" value="" placeholder="${D.config.bar.hasPassword ? '••••••••' : esc(t('password'))}"></div>
    <div class="row"><div class="t">${dot(linked)}${t('bound', { a: esc(link.host) + ':' + link.port })}<div class="d">${linked ? t('boundOk') : t('boundNo')}</div></div><button class="btn ghost small" id="link" ${online ? '' : 'disabled'}>${icon('link')} ${t('bind')}</button></div>
    <div class="row"><div class="t">${t('language')}<div class="d">${t('languageD')}</div></div><select id="lang">${langField.options.map(o => `<option value="${o.value}" ${agent.lang === o.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></div>
  </div>
  <h3>${t('orderTitle')}</h3><div class="card">
    <div class="note" style="padding-bottom:0">${t('orderD')}</div>
    ${orderIds().map((id, i, all) => `<div class="row"><div class="t">${esc(D.groups.find(x => x.id === id).label)}</div><div style="display:flex;gap:4px"><button class="btn ghost small" data-oup="${i}" ${i === 0 ? 'disabled' : ''} title="${esc(t('moveUp'))}">${icon('chevron-up')}</button><button class="btn ghost small" data-odown="${i}" ${i === all.length - 1 ? 'disabled' : ''} title="${esc(t('moveDown'))}">${icon('chevron-down')}</button></div></div>`).join('')}
  </div>
  <h3>${t('mac')}</h3><div class="card">
    <div class="row"><div class="t">${dot(S?.tray?.running)}${t('login')}<div class="d">${loginNote()}</div></div><label class="sw"><input type="checkbox" id="login" ${agent.launchAtLogin ? 'checked' : ''}><i></i></label></div>
    <div class="row"><div class="t">${t('showIcon')}<div class="d">${t('showIconD')}</div></div><select id="appIcon">${Object.entries(APP_ICON).map(([k, v]) => `<option value="${k}" ${agent.appIcon === k ? 'selected' : ''}>${t(v)}</option>`).join('')}</select></div>
    ${agent.appIcon === 'none' ? `<div class="warn" style="margin:0 0 12px">${t('noneWarn', { u: `<code>${esc(url)}</code>` })}</div>` : ''}
    <div class="row"><div class="t">${t('nameLabel')}<div class="d">${name ? t('nameOn', { u: `<code>${esc(D.aliasUrl || `http://${name}.local:${link.port}/ui`)}</code>` }) : t('nameOff')}</div><div class="e" id="nameErr"></div></div><input class="wide" type="text" id="host" maxlength="30" value="${esc(name)}" placeholder="boo"></div>
    ${D.aliasUrl ? `<div class="row"><div class="t">${t('linkTitle')}<div class="d">${t('linkD')}</div></div><div style="display:flex;gap:6px"><input class="wide" type="text" id="tokenLink" readonly value="${esc(D.aliasUrl + '?t=' + link.token)}"><button class="btn ghost small" id="copyLink">${icon('copy-check')} ${t('copy')}</button></div></div>` : ''}
  </div>
  <h3>${t('trayIcon')}</h3><div class="card"><div class="opts">${Object.keys(TRAY).map(k => `<label class="${agent.trayIcon === k ? 'on' : ''}"><input type="radio" name="icon" value="${k}" ${agent.trayIcon === k ? 'checked' : ''}>${ghostSvg(k)}${t(TRAY_NAME[k])}</label>`).join('')}</div>
  <div class="note">${t('trayNote')}</div></div>`;
}
function moveScreen(i, delta) {
  const ids = (sets.app.order || '').split(',');
  const j = i + delta;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  sets.app.order = ids.join(',');
  touch(); draw();
}
function bindGeneral() {
  const h = $('#barHost'); if (!h) return;
  document.querySelectorAll('[data-oup]').forEach(b => b.onclick = () => moveScreen(Number(b.dataset.oup), -1));
  document.querySelectorAll('[data-odown]').forEach(b => b.onclick = () => moveScreen(Number(b.dataset.odown), 1));
  h.oninput = () => { agent.bar.host = h.value; touch(); };
  $('#barPass').oninput = e => { agent.bar.password = e.target.value; touch(); };
  document.querySelectorAll('input[name=icon]').forEach(r => r.onchange = () => { agent.trayIcon = r.value; touch(); draw(); });
  $('#login').onchange = e => { agent.launchAtLogin = e.target.checked; touch(); };
  $('#appIcon').onchange = e => { agent.appIcon = e.target.value; touch(); draw(); };
  const host = $('#host');
  host.oninput = e => {
    const v = e.target.value.replace(/[^a-z0-9-]/gi, '').toLowerCase();
    const bad = reserved(v);
    host.classList.toggle('bad', bad);
    $('#nameErr').textContent = bad ? t('nameReserved', { n: v }) : '';
    // A reserved name is never kept: it is the bar's own.
    if (!bad) { agent.uiHostname = v; touch(); }
  };
  host.onchange = () => { if (!reserved(host.value)) draw(); };
  // The language switches the whole app, so it is saved at once.
  $('#lang').onchange = async e => { agent.lang = e.target.value; bar.lang = e.target.value; lang = agent.lang; await saveAll(); };
  const copy = $('#copyLink');
  if (copy) copy.onclick = async () => { const f = $('#tokenLink'); f.select(); try { await navigator.clipboard.writeText(f.value); } catch { document.execCommand('copy'); } say(t('copied')); };
  $('#link').onclick = () => { bar.agent_host = D.link.host; bar.agent_port = D.link.port; touch(); draw(); };
}

// ---- page ------------------------------------------------------------------------------------
function applyTexts() {
  document.documentElement.lang = lang;
  document.title = t('title');
  $('#reload').textContent = t('discard');
  $('#save').textContent = t('save');
}
function draw() {
  applyTexts();
  drawNav();
  const g = D.groups.find(x => x.id === tab);
  if (tab === 'general' || !g) $('#main').innerHTML = general();
  else if (D.modules && D.modules[g.id] === false) $('#main').innerHTML = installCard(g);
  else $('#main').innerHTML = `<h2>${esc(g.label)}</h2><p class="sub">${t('screenSub')}</p>${groupCard(g)}${extras(tab)}`;
  bindFields(); bindExtras(); bindGeneral(); bindMascots();
}

async function load() {
  [D, S] = await Promise.all([api('/api/config'), api('/api/status')]);
  // The bar's own settings are flat; the defaults fill in what the bar has not stored yet.
  const base = {};
  for (const [k, f] of Object.entries(D.schema.fields)) base[k] = f.default;
  bar = Object.assign(base, D.bar.doc?.values || {});
  sets = JSON.parse(JSON.stringify(D.settings));
  agent = JSON.parse(JSON.stringify({ servers: D.config.servers, calendarExclude: D.config.calendarExclude, trayIcon: D.config.trayIcon, launchAtLogin: D.config.launchAtLogin, appIcon: D.config.appIcon, uiHostname: D.config.uiHostname, lang: D.config.lang, bar: { host: D.config.bar.host, password: '' } }));
  lang = agent.lang;
  dirty = false; say(D.bar.online ? t('connected') : t('barDown'), !D.bar.online);
  draw();
}

async function saveAll() {
  say(t('saving'));
  try {
    await api('/api/config', { method: 'PUT', body: JSON.stringify({ agent, settings: sets, bar: D.bar.online ? { version: D.schema.version, values: bar } : undefined }) });
    await load(); say(t('saved'));
  } catch (e) {
    // The agent may have taken part of it (the language, say): show what it really holds.
    await load().catch(() => {});
    say(t('failed') + e.message, true);
  }
}
$('#save').onclick = saveAll;
$('#reload').onclick = () => load().catch(e => say(e.message, true));
window.onbeforeunload = () => (dirty ? t('unsaved') : undefined);
load().catch(e => {
  if (String(e.message) === 'unauthorized') {
    // A new address has no token yet: ask for it once.
    applyTexts();
    $('#nav').innerHTML = '';
    $('.bar').style.display = 'none';
    $('#main').innerHTML = `<h2>${t('needToken')}</h2><p class="sub">${esc(t('needTokenD'))}</p><div class="card"><div class="row"><input class="wide" type="password" id="tok" placeholder="${esc(t('tokenPlaceholder'))}"><button class="btn" id="tokGo">${t('tokenGo')}</button></div></div>`;
    $('#tokGo').onclick = () => { localStorage.setItem('bbs-token', $('#tok').value.trim()); location.reload(); };
    return;
  }
  $('#main').innerHTML = `<div class="warn">${esc(t('loadFailed', { e: e.message }))}</div>`;
});
setInterval(() => { if (!dirty) api('/api/status').then(s => { S = s; }).catch(() => {}); }, 5000);
</script>
</body>
</html>
