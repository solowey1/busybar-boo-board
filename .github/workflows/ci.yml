name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Every app has the same version, the one in package.json.
      - run: npm run versions

      - run: npm run typecheck

      - run: npm run build

      # The agent's tests (the macOS-only ones skip themselves elsewhere).
      - run: npm test
