# Tag 0.3.0 → release with an <id>-<version>.tgz for every app of the repository (the one with all the screens, and one for each screen),
# whether the tag is pushed from a console or made by a release in the GitHub UI.
# The tag must match the version of every app (package.json and the manifests), and each manifest must carry an api_version.
# The same tag builds the agent's packages (macOS arm64 and Intel, Linux x64 and arm64, Windows) on runners of their own systems
# and attaches them to the release. Packages are not built by hand: to try the build without a tag, run this workflow from the
# Actions tab ("Run workflow"); the packages come as artifacts of the run.

name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # All the apps of the repository share one version, and the tag is it.
      - name: Check the versions against the tag
        run: |
          node tools/check-versions.mjs "$GITHUB_REF_NAME"
          for f in apps/*/src/appmeta/manifest.json; do
            if [ -z "$(jq -r '.api_version // empty' "$f")" ]; then
              echo "::error::$f has no api_version"
              exit 1
            fi
          done
          {
            echo "## Apps for the bar"
            echo
            echo "- **Boo Board** (\`app.solowey.boo-board\`): all the screens in one app, the wheel goes round them."
            echo "- One app for each screen: \`boo-music\`, \`boo-agents\`, \`boo-servers\`, \`boo-calendar\`, \`boo-work\`. Install only the ones you need."
            echo "- Version: $GITHUB_REF_NAME"
          } > "$RUNNER_TEMP/details.md"

      - run: npm run typecheck

      # One archive for each app, named <id>-<version>.tgz.
      - run: npm run build -- --tgz-name "{id}-{version}.tgz"

      # A release made from the UI already exists by the time the tag push gets here: attach the archives to it and keep whatever notes were written by hand, below the apps' details.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls apps/*/dist/*.tgz)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/body.md"
            # A re-run finds the details already there.
            if ! grep -q "^## Apps for the bar" "$RUNNER_TEMP/body.md"; then
              { cat "$RUNNER_TEMP/details.md"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/notes.md"
              gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/details.md" \
              --generate-notes
          fi

  # The agent for the computer, one package per system, attached to the same release.
  agent:
    needs: release
    # Runs after the release job, and on its own when the workflow is started by hand (the release job is skipped then).
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: win-x64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # On Windows, bash finds Git's GNU tar first: it takes "D:\..." for a host name and cannot write zip. Both the build (busy-cli
      # packs the apps with tar) and the packager need Windows' own tar (bsdtar), so System32 goes first.
      # The packages carry the bar app's archive too.
      - run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="/c/Windows/System32:$PATH"; fi
          npm run build
        shell: bash

      - run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="/c/Windows/System32:$PATH"; fi
          node mac-agent/tools/package.mjs ${{ matrix.target }}
        shell: bash

      - name: Keep the package as an artifact of the run
        uses: actions/upload-artifact@v5
        with:
          name: boo-board-${{ matrix.target }}
          path: mac-agent/release/boo-board-*-${{ matrix.target }}.*
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mac-agent/release/boo-board-*-${{ matrix.target }}.* --clobber
